labels: ["new"]
body:
  - type: markdown
    attributes:
      value: |
        This category is for our publications on pricing European options, such as [black76-zig](https://github.com/CMZN-Consulting/black76-zig): your results, your doubts and what you use them for.

        Before you post, please search: if someone has already said it, reply or upvote there.
  - type: dropdown
    id: mark
    attributes:
      label: Mark your post
      description: Is anything in your post contested, uncertain or unsettling? Say so here, before anyone reads it, and pick every mark that applies. No post is removed because of its mark. A mark you leave out may be added by a moderator and recorded in the public moderation log.
      multiple: true
      options:
        - "Plain: none of the three"
        - "Contested: some will dispute it"
        - "Uncertain: I am not sure it holds"
        - "Unsettling: it may disturb a reader"
    validations:
      required: true
  - type: input
    id: publication
    attributes:
      label: Which publication
      description: Its name, with a version or commit if you have one.
    validations:
      required: true
  - type: textarea
    id: post
    attributes:
      label: Your result, doubt or use
      description: For a result, say what you ran and on what hardware.
    validations:
      required: true
